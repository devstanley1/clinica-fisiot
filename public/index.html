<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecionando - FisioVida</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #0f172a;
            color: #f8fafc;
            font-family: 'Outfit', sans-serif;
            text-align: center;
        }

        .redirect-box {
            background: rgba(255, 255, 255, 0.05);
            padding: 3rem;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: #38bdf8;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1.5rem auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        h1 {
            margin: 0 0 1rem 0;
            font-size: 1.8rem;
        }

        p {
            color: #94a3b8;
            margin: 0;
        }

        .btn-manual {
            margin-top: 2rem;
            display: inline-block;
            background: #38bdf8;
            color: #0f172a;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="redirect-box">
        <div class="spinner"></div>
        <h1>Fisio<span>Vida</span></h1>
        <p>Acessando o Portal Seguro de Agendamentos...</p>

        <script>
            // Redirecionamento Estático Principal
            setTimeout(() => {
                window.location.replace("login.html");
            }, 800);
        </script>

        <noscript>
            <p style="color: #ef4444; margin-top: 20px;">Seu navegador bloqueou o redirecionamento.</p>
            <a href="login.html" class="btn-manual">Ir para o Login Manualmente</a>
        </noscript>
    </div>
</body>

</html>
