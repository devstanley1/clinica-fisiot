<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso - Clínica FisioVida</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .portal-container {
            width: 100%;
            max-width: 900px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 10px;
            color: #f8fafc;
        }

        .logo span {
            color: #38bdf8;
        }

        .portal-subtitle {
            color: #94a3b8;
            font-size: 1.1rem;
            margin-bottom: 40px;
        }

        .roles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .role-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 30px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .role-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .role-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .role-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .role-desc {
            font-size: 0.85rem;
            color: #94a3b8;
        }

        /* Cores Específicas no Hover */
        .role-card.paciente:hover {
            border-color: #10b981;
            box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.3);
        }

        .role-card.fisio:hover {
            border-color: #f59e0b;
            box-shadow: 0 10px 25px -5px rgba(245, 158, 11, 0.3);
        }

        .role-card.recepcao:hover {
            border-color: #8b5cf6;
            box-shadow: 0 10px 25px -5px rgba(139, 92, 246, 0.3);
        }

        .role-card.admin:hover {
            border-color: #ef4444;
            box-shadow: 0 10px 25px -5px rgba(239, 68, 68, 0.3);
        }

        @media (max-width: 600px) {
            .portal-container {
                padding: 30px 20px;
            }

            .roles-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 400px) {
            .roles-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="portal-container">
        <h1 class="logo">Fisio<span>Vida</span></h1>
        <p class="portal-subtitle">Escolha o seu perfil de acesso ao Sistema Integrado para visualizar a interface de
            demonstração.</p>

        <div class="roles-grid">
            <!-- Card Paciente -->
            <a href="login.html?role=paciente&name=Maria Silva" class="role-card paciente">
                <div class="role-icon"><i class="ph ph-wheelchair"></i></div>
                <div class="role-title">Paciente</div>
                <div class="role-desc">Agendamentos e Progresso</div>
            </a>

            <!-- Card Fisioterapeuta -->
            <a href="login.html?role=fisioterapeuta&name=Dr. Carlos Mendes" class="role-card fisio">
                <div class="role-icon"><i class="ph ph-stethoscope"></i></div>
                <div class="role-title">Especialista</div>
                <div class="role-desc">Prontuários e Avaliações</div>
            </a>

            <!-- Card Recepção -->
            <a href="login.html?role=recepcao&name=Recepção Central" class="role-card recepcao">
                <div class="role-icon"><i class="ph ph-headset"></i></div>
                <div class="role-title">Recepção</div>
                <div class="role-desc">Balcão e Pagamentos</div>
            </a>

            <!-- Card Admin -->
            <a href="login.html?role=admin&name=Diretoria Geral" class="role-card admin">
                <div class="role-icon"><i class="ph ph-gear"></i></div>
                <div class="role-title">Gestão</div>
                <div class="role-desc">Faturamento e Relatórios</div>
            </a>
        </div>
    </div>

    <script>
        // Nenhuma lógica necessária aqui no Dashboard Index, as referências url conduzirão à página de Login Fake.
    </script>
</body>

</html>
