<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Painel - FisioVida</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .dashboard-container {
            max-width: 1000px;
            margin: 100px auto;
            padding: 2rem;
        }

        .header-dash {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .appointments-list {
            display: grid;
            gap: 1rem;
        }

        .apt-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 1.5rem;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid var(--primary-color);
        }

        .apt-info h4 {
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }

        .action-btn {
            background: #ff4757;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        .action-btn:hover {
            background: #ff6b81;
        }
    </style>
</head>

<body>
    <header class="navbar">
        <div class="container nav-content">
            <h1 class="logo">Fisio<span>Vida</span> - CLIENTE</h1>
            <nav>
                <ul>
                    <li><a href="index.html#booking" class="btn-primary-sm">Novo Agendamento</a></li>
                    <li><a href="#" onclick="logout()" class="btn-secondary-sm">Sair</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="dashboard-container">
        <div class="header-dash">
            <h2>Bem-vindo, <span id="userNameText">Paciente</span></h2>
            <p>Seus agendamentos futuros aparecerão aqui.</p>
        </div>

        <div class="appointments-list" id="myAppointments">
            <!-- Injetado via JS -->
            <p>Carregando histórico particular...</p>
        </div>
    </main>

    <script>
        const token = localStorage.getItem('token');
        const role = localStorage.getItem('role');
        const userName = localStorage.getItem('name');

        if (!token || role !== 'cliente') {
            window.location.href = 'login.html';
        }

        if (userName) {
            document.getElementById('userNameText').innerText = userName;
        }

        async function loadMyAppointments() {
            // MOCK DATA: Simulando a consulta do Cliente logado na Vercel estática
            const data = [
                { id: 205, service: 'Avaliação Geral (Mock)', date: '2026-03-22', time: '10:00', status: 'agendado' }
            ];

            const list = document.getElementById('myAppointments');
            list.innerHTML = '';

            if (data.length === 0) {
                list.innerHTML = '<p>Você não possui nenhum agendamento na FisioVida.</p>';
            } else {
                data.forEach(apt => {
                    list.innerHTML += `
                        <div class="apt-card">
                            <div class="apt-info">
                                <h4>${apt.service}</h4>
                                <p>📅 ${apt.date} às ${apt.time}</p>
                                <small style="color: #2ed573">Status: ${apt.status}</small>
                            </div>
                            <button class="action-btn" onclick="deleteApt(${apt.id})">Cancelar Consulta</button>
                        </div>
                    `;
                });
            }
        }

        async function deleteApt(id) {
            if (confirm('Simulação Local: Seu agendamento visual não pode ser excluído permanentemente pois não enviamos o PostgreSQL para nuvem.')) {
                // mock visual
                document.getElementById('myAppointments').innerHTML = '<p>Você Cancelou (Visualmente).</p>';
            }
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }

        loadMyAppointments();
    </script>
</body>

</html>
