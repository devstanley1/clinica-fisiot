<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Clínica FisioVida</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body  class="inline-fix-register-150">

    <div class="logo text-center mb-3">Fisio<span  class="inline-fix-register-151">Vida</span></div>

    <div class="booking-card glass-panel inline-fix-register-152">

        <div class="booking-info text-center inline-fix-register-153">
            <h3  class="inline-fix-register-154">Crie sua Conta</h3>
            <p  class="inline-fix-register-155">Seja bem-vindo(a) ao seu novo portal de saúde.</p>
        </div>

        <form id="registerForm" class="booking-form inline-fix-register-156">
            <div class="form-group">
                <label for="regName">Nome Completo</label>
                <input type="text" id="regName" placeholder="Ex: Maria Silva" required  title="Campo de entrada" />
            </div>
            <div class="form-group">
                <label for="regCpf">CPF</label>
                <input type="text" id="regCpf" placeholder="000.000.000-00" maxlength="14" required  title="Campo de entrada" />
            </div>
            <div class="form-group">
                <label for="regEmail">E-mail Pessoal</label>
                <input type="email" id="regEmail" placeholder="seu@email.com" required  title="Campo de entrada" />
            </div>
            <div class="form-group">
                <label for="regPassword">Senha Segura</label>
                <input type="password" id="regPassword" placeholder="Mínimo 6 caracteres" minlength="6" required  title="Campo de entrada" />
            </div>

            <button type="submit" class="btn-submit inline-fix-register-157" id="submitRegBtn" title="Ação" aria-label="Botão de interface">
                <span class="btn-text">Finalizar Cadastro</span>
                <span class="spinner inline-fix-register-158" id="btnRegSpinner">⏳ Criando...</span>
            </button>
            <div id="formRegMessage" class="form-message"></div>
        </form>

        <p class="text-center inline-fix-register-159">Já tem uma conta? <a href="login.html" class="inline-fix-register-160">Faça
                Login aqui.</a></p>
    </div>

    <script src="js/auth.js"></script>
</body>

</html>
