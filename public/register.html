<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Clínica FisioVida</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body
    style="background: linear-gradient(135deg, #e0f2fe 0%, #ccfbf1 100%); min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 2rem;">

    <div class="logo text-center mb-3">Fisio<span style="color: var(--secondary)">Vida</span></div>

    <div class="booking-card glass-panel"
        style="width: 100%; max-width: 500px; padding: 3rem; flex-direction: column; gap: 2rem; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);">

        <div class="booking-info text-center" style="width: 100%;">
            <h3 style="color: var(--primary-dark); font-size: 2rem; margin-bottom: 0.5rem;">Crie sua Conta</h3>
            <p style="color: var(--text-muted); font-size: 1rem;">Seja bem-vindo(a) ao seu novo portal de saúde.</p>
        </div>

        <form id="registerForm" class="booking-form" style="width: 100%; box-shadow: none; padding: 0;">
            <div class="form-group">
                <label for="regName">Nome Completo</label>
                <input type="text" id="regName" placeholder="Ex: Maria Silva" required />
            </div>
            <div class="form-group">
                <label for="regCpf">CPF</label>
                <input type="text" id="regCpf" placeholder="000.000.000-00" maxlength="14" required />
            </div>
            <div class="form-group">
                <label for="regEmail">E-mail Pessoal</label>
                <input type="email" id="regEmail" placeholder="seu@email.com" required />
            </div>
            <div class="form-group">
                <label for="regPassword">Senha Segura</label>
                <input type="password" id="regPassword" placeholder="Mínimo 6 caracteres" minlength="6" required />
            </div>

            <button type="submit" class="btn-submit" id="submitRegBtn" style="margin-top: 2rem;">
                <span class="btn-text">Finalizar Cadastro</span>
                <span class="spinner" id="btnRegSpinner" style="display: none;">⏳ Criando...</span>
            </button>
            <div id="formRegMessage" class="form-message"></div>
        </form>

        <p class="text-center" style="margin-top: 1rem; color: var(--text-muted);">Já tem uma conta? <a
                href="login.html" style="color: var(--primary); font-weight: 600; text-decoration: underline;">Faça
                Login aqui.</a></p>
    </div>

    <script src="js/auth.js"></script>
</body>

</html>
