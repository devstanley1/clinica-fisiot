<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - Clínica FisioVida</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body
    style="background: linear-gradient(135deg, #e0f2fe 0%, #ccfbf1 100%); min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 2rem;">

    <div class="logo text-center mb-3">Fisio<span style="color: var(--secondary)">Vida</span></div>

    <div class="booking-card glass-panel"
        style="width: 100%; max-width: 450px; padding: 3rem; flex-direction: column; gap: 2rem; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);">

        <div class="booking-info text-center" style="width: 100%;">
            <h3 style="color: var(--primary-dark); font-size: 2rem; margin-bottom: 0.5rem;">Acesse sua Conta</h3>
            <p style="color: var(--text-muted); font-size: 1rem;">Gerencie seus agendamentos rápidos.</p>
        </div>

        <form id="loginForm" class="booking-form" style="width: 100%; box-shadow: none; padding: 0;">
            <div class="form-group">
                <label for="loginEmail">Seu E-mail</label>
                <input type="email" id="loginEmail" placeholder="seu@email.com" required />
            </div>
            <div class="form-group">
                <label for="loginPassword">Sua Senha</label>
                <input type="password" id="loginPassword" placeholder="******" required />
            </div>

            <button type="submit" class="btn-submit" id="submitLogBtn" style="margin-top: 1rem;">
                <span class="btn-text">Entrar no Sistema</span>
                <span class="spinner" id="btnLogSpinner" style="display: none;">⏳ Autenticando...</span>
            </button>
            <div id="formLogMessage" class="form-message"></div>
        </form>

        <div style="display: flex; justify-content: space-between; width: 100%; margin-top: 1rem; font-size: 0.95rem;">
            <a href="recover.html" style="color: var(--text-muted); text-decoration: underline;">Esqueceu a senha?</a>
            <a href="register.html" style="color: var(--primary); font-weight: 600;">Criar uma Conta</a>
        </div>
    </div>

    <!-- Voltar -->
    <a href="index.html" style="margin-top: 2rem; color: var(--text-main); text-decoration: underline;">← Voltar para a
        Página Inicial</a>

    <script src="js/auth.js"></script>
</body>

</html>
