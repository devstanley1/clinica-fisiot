<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - FisioVida</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #0f172a;
            background-image:
                radial-gradient(at 0% 0%, hsla(253, 16%, 7%, 1) 0, transparent 50%),
                radial-gradient(at 50% 0%, hsla(225, 39%, 30%, 0.1) 0, transparent 50%),
                radial-gradient(at 100% 0%, hsla(339, 49%, 30%, 0.1) 0, transparent 50%);
            color: #f8fafc;
        }

        .auth-container {
            background: rgba(30, 41, 59, 0.7);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            padding: 3rem;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .auth-container h2 {
            color: white;
            margin-bottom: 0.5rem;
        }

        .auth-container p {
            color: #d1d8e0;
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            color: white;
            margin-bottom: 0.5rem;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border-radius: 8px;
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--primary-color);
        }

        .btn-full {
            width: 100%;
        }

        .auth-links {
            margin-top: 1.5rem;
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
        }

        .auth-links a {
            color: var(--primary-color);
            text-decoration: none;
        }

        .auth-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="auth-container">
        <h2>Entrar na FisioVida</h2>
        <p>Acesse seu painel com Suas Credenciais.</p>

        <form id="loginForm">
            <div id="dynamicWarning" class="inline-fix-login-135">
                Identificando cargo...
            </div>

            <div class="form-group inline-fix-login-136">
                <label>E-mail</label>
                <input type="email" id="email" placeholder="Automático" value="fake@email.com" title="Campo de entrada">
            </div>
            <div class="form-group inline-fix-login-137">
                <label>Senha</label>
                <input type="password" id="password" placeholder="***" value="1234" title="Campo de entrada">
            </div>

            <button type="submit" class="btn-primary btn-full" title="Ação" aria-label="Botão de interface">Entrar</button>
        </form>

        <div class="auth-links">
            <a href="register.html">Não tenho conta</a>
            <a href="index.html">Sair e voltar ao Início</a>
        </div>
    </div>

    <script>
        // Captura o cargo e o nome injetados via URL na home
        const urlParams = new URLSearchParams(window.location.search);
        let roleAtiva = urlParams.get('role') || 'cliente';
        let nomeAtivo = urlParams.get('name') || 'Visitante';

        // Atualiza a UI para refletir o usuário interceptado
        document.getElementById('dynamicWarning').innerText = `Acesso de Demonstração Solicitado:\nCargo: ${roleAtiva.toUpperCase()}`;

        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();

            // Grava nas Chaves MESTRES que as Dashboards usam para validar segurança
            localStorage.setItem('jwtToken', 'simulated_static_token_777');
            localStorage.setItem('userRole', roleAtiva);
            localStorage.setItem('userName', nomeAtivo);

            // Roteamento inteligente após armazenamento 
            if (roleAtiva === 'admin') {
                window.location.href = 'dashboard-admin.html';
            } else if (roleAtiva === 'fisioterapeuta') {
                window.location.href = 'dashboard-fisio.html';
            } else if (roleAtiva === 'recepcao') {
                window.location.href = 'dashboard-recepcao.html';
            } else {
                window.location.href = 'dashboard-cliente.html';
            }
        });
    </script>
</body>

</html>
