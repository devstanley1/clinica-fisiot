<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Clínica FisioVida</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .dashboard-container {
            max-width: 1000px;
            margin: 3rem auto;
            padding: 0 1.5rem;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 1rem;
            margin-bottom: 2rem;
        }

        .welcome-msg {
            font-family: var(--font-heading);
            font-size: 1.8rem;
            color: var(--primary-dark);
        }

        .apt-card {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            border-left: 5px solid var(--primary);
        }

        .btn-danger {
            background: #ef4444;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
        }

        .badge-admin {
            background: #fee2e2;
            color: #991b1b;
            padding: 0.3rem 0.8rem;
            border-radius: 99px;
            font-size: 0.8rem;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <header class="navbar" style="background: #0f172a;">
        <div class="container nav-content">
            <h1 class="logo" style="color: white;">Fisio<span style="color: #38bdf8">Admin</span></h1>
            <nav>
                <ul>
                    <li><a href="#" id="logoutBtn" style="color: #ef4444; font-weight: 600;">Encerrar Sessão Segura</a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="dashboard-container">
        <div class="dashboard-header">
            <div>
                <h2 class="welcome-msg">Painel Central <span class="badge-admin">Nível Acesso: Admin</span></h2>
                <p style="color: var(--text-muted)">Visão Geral de todos os Agendamentos da Clínica.</p>
            </div>
        </div>

        <h3 style="margin-bottom: 1.5rem; color: var(--text-main);">Agenda Geral da Clínica</h3>

        <div id="adminAppointmentsList">
            <p style="color: var(--text-muted);">Carregando agendamentos gerais...</p>
        </div>
    </main>

    <script src="js/dashboard-admin.js"></script>
</body>

</html>
