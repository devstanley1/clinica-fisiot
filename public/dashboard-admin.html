<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Admin - FisioVida</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .dashboard-container {
            max-width: 1200px;
            margin: 100px auto;
            padding: 2rem;
        }

        .header-dash {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .appointments-table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            overflow: hidden;
        }

        .appointments-table th,
        .appointments-table td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .appointments-table th {
            background: rgba(0, 168, 255, 0.1);
            color: var(--primary-color);
        }

        .action-btn {
            background: #ff4757;
            color: white;
            border: none;
            padding: 5px 15px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        .action-btn:hover {
            background: #ff6b81;
        }
    </style>
</head>

<body>
    <header class="navbar">
        <div class="container nav-content">
            <h1 class="logo">Fisio<span>Vida</span> - ADMIN</h1>
            <nav>
                <ul>
                    <li><a href="index.html">Voltar ao Site</a></li>
                    <li><a href="#" onclick="logout()" class="btn-secondary-sm">Sair</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="dashboard-container">
        <div class="header-dash">
            <h2>Gestão Total de Agendamentos (Mesa)</h2>
            <p>Acesso Exclusivo da Recepção / Gerência</p>
        </div>

        <div class="card glass-card">
            <table class="appointments-table" id="adminTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Paciente</th>
                        <th>Serviço</th>
                        <th>Data</th>
                        <th>Hora</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Injetado via JS -->
                </tbody>
            </table>
        </div>
    </main>

    <script>
        const token = localStorage.getItem('token');
        const role = localStorage.getItem('role');

        if (!token || role !== 'admin') {
            window.location.href = 'login.html';
        }

        async function loadAllAppointments() {
            // MOCK DATA: Simulando resposta do banco de dados na Vercel estática
            const data = [
                { id: 101, clientName: 'João Silva', service: 'Fisioterapia Ortopédica', date: '2026-04-10', time: '14:00', status: 'agendado' },
                { id: 102, clientName: 'Maria Mendonça', service: 'Pilates Clínico', date: '2026-04-11', time: '09:00', status: 'agendado' },
                { id: 105, clientName: 'Roberto Carlos', service: 'Avaliação Geral', date: '2026-04-12', time: '16:30', status: 'concluído' }
            ];

            const tbody = document.querySelector('#adminTable tbody');
            tbody.innerHTML = '';

            data.forEach(apt => {
                let statusColor = apt.status === 'agendado' ? '#2ed573' : '#a4b0be';
                tbody.innerHTML += `
                    <tr>
                        <td>#${apt.id}</td>
                        <td><strong>${apt.clientName}</strong></td>
                        <td>${apt.service}</td>
                        <td>${apt.date}</td>
                        <td>${apt.time}</td>
                        <td><span style="color: ${statusColor}">${apt.status}</span></td>
                        <td>
                            <button class="action-btn" onclick="deleteApt(${apt.id})">Cancelar / Remover da Grade</button>
                        </td>
                    </tr>
                `;
            });
        }

        async function deleteApt(id) {
            if (confirm('Funcionalidade Estática: O Agendamento não é modificado permanentemente na Vercel.')) {
                alert("Simulado: Agendamento Removido!");
            }
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }

        loadAllAppointments();
    </script>
</body>

</html>
