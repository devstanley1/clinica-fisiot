<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - Clínica FisioVida</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body
    style="background: linear-gradient(135deg, #e0f2fe 0%, #ccfbf1 100%); min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 2rem;">

    <div class="logo text-center mb-3">Fisio<span style="color: var(--secondary)">Vida</span></div>

    <div class="booking-card glass-panel"
        style="width: 100%; max-width: 450px; padding: 3rem; flex-direction: column; gap: 2rem; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);">

        <div class="booking-info text-center" style="width: 100%;">
            <h3 style="color: var(--primary-dark); font-size: 1.8rem; margin-bottom: 0.5rem;">Recuperar Acesso</h3>
            <p style="color: var(--text-muted); font-size: 0.95rem;">Digite seu E-mail abaixo. Te enviaremos um link
                seguro para redefinição de senha.</p>
        </div>

        <form id="recoverForm" class="booking-form" style="width: 100%; box-shadow: none; padding: 0;">
            <div class="form-group">
                <label for="recoverEmail">Seu E-mail Cadastrado</label>
                <input type="email" id="recoverEmail" placeholder="seu@email.com" required />
            </div>

            <button type="submit" class="btn-submit" id="submitRecBtn" style="margin-top: 1rem;">
                <span class="btn-text">Enviar Link</span>
                <span class="spinner" id="btnRecSpinner" style="display: none;">⏳ Enviando...</span>
            </button>
            <div id="formRecMessage" class="form-message"></div>
        </form>

        <p class="text-center" style="margin-top: 1rem; color: var(--text-muted); font-size: 0.95rem;">Lembrou a senha?
            <a href="login.html" style="color: var(--primary); font-weight: 600; text-decoration: underline;">Voltar
                para o Login</a></p>
    </div>

    <!-- Voltar -->
    <a href="index.html" style="margin-top: 2rem; color: var(--text-main); text-decoration: underline;">← Voltar para a
        Página Inicial</a>

    <script src="js/auth.js"></script>
</body>

</html>
