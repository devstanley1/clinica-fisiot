<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - Clínica FisioVida</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body  class="inline-fix-recover-138">

    <div class="logo text-center mb-3">Fisio<span  class="inline-fix-recover-139">Vida</span></div>

    <div class="booking-card glass-panel inline-fix-recover-140">

        <div class="booking-info text-center inline-fix-recover-141">
            <h3  class="inline-fix-recover-142">Recuperar Acesso</h3>
            <p  class="inline-fix-recover-143">Digite seu E-mail abaixo. Te enviaremos um link
                seguro para redefinição de senha.</p>
        </div>

        <form id="recoverForm" class="booking-form inline-fix-recover-144">
            <div class="form-group">
                <label for="recoverEmail">Seu E-mail Cadastrado</label>
                <input type="email" id="recoverEmail" placeholder="seu@email.com" required  title="Campo de entrada" />
            </div>

            <button type="submit" class="btn-submit inline-fix-recover-145" id="submitRecBtn" title="Ação" aria-label="Botão de interface">
                <span class="btn-text">Enviar Link</span>
                <span class="spinner inline-fix-recover-146" id="btnRecSpinner">⏳ Enviando...</span>
            </button>
            <div id="formRecMessage" class="form-message"></div>
        </form>

        <p class="text-center inline-fix-recover-147">Lembrou a senha?
            <a href="login.html" class="inline-fix-recover-148">Voltar
                para o Login</a></p>
    </div>

    <!-- Voltar -->
    <a href="index.html" class="inline-fix-recover-149">← Voltar para a
        Página Inicial</a>

    <script src="js/auth.js"></script>
</body>

</html>
