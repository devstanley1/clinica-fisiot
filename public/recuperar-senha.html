<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - FisioVida</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #0f172a;
            background-image:
                radial-gradient(at 0% 0%, hsla(253, 16%, 7%, 1) 0, transparent 50%),
                radial-gradient(at 50% 0%, hsla(225, 39%, 30%, 0.1) 0, transparent 50%),
                radial-gradient(at 100% 0%, hsla(339, 49%, 30%, 0.1) 0, transparent 50%);
            color: #f8fafc;
            margin: 0;
            font-family: 'Outfit', sans-serif;
        }

        .auth-container {
            background: rgba(30, 41, 59, 0.7);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            padding: 3rem;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .auth-container h2 {
            color: #f8fafc;
            margin-bottom: 0.5rem;
            font-size: 1.8rem;
        }

        .auth-container p {
            color: #94a3b8;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            color: #cbd5e1;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(15, 23, 42, 0.6);
            color: #f8fafc;
            border-radius: 10px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus {
            border-color: #8b5cf6;
        }

        .btn-primary {
            background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            width: 100%;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(139, 92, 246, 0.4);
        }

        .auth-links {
            margin-top: 2rem;
            display: flex;
            justify-content: center;
        }

        .auth-links a {
            color: #8b5cf6;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: color 0.3s ease;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .auth-links a:hover {
            color: #a78bfa;
            text-decoration: underline;
        }

        .icon-header {
            font-size: 3.5rem;
            color: #8b5cf6;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

    <div class="auth-container">
        <i class="ph ph-lock-key icon-header"></i>
        <h2>Recuperar Acesso</h2>
        <p>Insira seu e-mail vinculado à clínica para receber o link de redefinição de senha.</p>

        <form id="recoverForm">
            <div class="form-group">
                <label>E-mail Cadastrado</label>
                <input type="email" id="email" required placeholder="exemplo@email.com" title="Campo de entrada">
            </div>

            <button type="submit" class="btn-primary" title="Ação" aria-label="Botão de interface">
                <i class="ph ph-paper-plane-right"></i> Enviar Link de Recuperação
            </button>
        </form>

        <div class="auth-links">
            <a href="index.html"><i class="ph ph-arrow-left"></i> Voltar ao Início</a>
        </div>
    </div>

    <script>
        document.getElementById('recoverForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;

            // Simulação de ação de interface para cumprir a diretriz da Sprint 13
            alert(`MOCK AÇÃO: Um e-mail de recuperação fictício foi enviado para ${email}.\nVerifique sua caixa de entrada (Mentirinha, não fomos programados para disparar e-mails de verdade na Demo!).`);

            // Retorna ao Portal
            window.location.href = 'index.html';
        });
    </script>
</body>

</html>
